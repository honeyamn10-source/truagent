[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truagent"
version = "1.0.0"
description = "The zero-dependency Python agent framework. Build, test and ship LLM agents that work everywhere."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jawagall AI Contributors" }]
keywords = ["llm", "agent", "ai", "tool", "framework", "zero-dependency", "openai", "ollama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/honeyamn10-source/truagent"
Repository = "https://github.com/honeyamn10-source/truagent"
Documentation = "https://github.com/honeyamn10-source/truagent#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=4.0",
]
examples = [
    "requests>=2.31",
]

[project.scripts]
truagent = "truagent.cli:main"

[tool.setuptools.packages.find]
include = ["truagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]